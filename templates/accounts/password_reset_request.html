{% extends 'base.html' %}

{% block title %}Password Reset - KUPPET Siaya Branch{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <h1 class="auth-heading">Reset Password</h1>
        <p class="auth-subheading">Enter your email or TSC number and we'll send you a link to reset your password.</p>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div class="field">
                <label for="identifier">Email or TSC Number</label>
                <input type="text" id="identifier" name="identifier" required class="text-input" autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-full">Send Reset Link</button>
        </form>

        <div class="auth-links">
            <a href="{% url 'login' %}" class="text-link">Back to login</a>
        </div>
    </div>
</section>
{% endblock %}
