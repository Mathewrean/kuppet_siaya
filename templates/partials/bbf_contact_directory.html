<section class="bbf-contact-directory">
    <div class="section-heading">
        <span class="section-heading__eyebrow">Get in Touch</span>
        <h2 class="section-heading__title">For BBF Enquiries Contact</h2>
    </div>
    
    <div class="contact-grid">
        {% for contact in contacts %}
        <div class="contact-card">
            <div class="contact-role">{{ contact.role }}</div>
            <a href="tel:+254{{ contact.phone }}" class="contact-phone">
                <span class="phone-icon">📞</span>
                {{ contact.phone_display }}
            </a>
        </div>
        {% endfor %}
    </div>
</section>

<style>
.bbf-contact-directory {
    margin: 2rem 0;
}
.contact-grid {
    display: grid;
    gap: 1rem;
    margin-top: 1rem;
}
@media (min-width: 768px) {
    .contact-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}
@media (max-width: 767px) and (min-width: 640px) {
    .contact-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
.contact-card {
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    padding: 1rem;
    text-align: center;
    background: #fff;
}
.contact-role {
    font-weight: 700;
    color: #006633;
    margin-bottom: 0.5rem;
}
.contact-phone {
    color: #111827;
    text-decoration: none;
    font-size: 1.125rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}
.contact-phone:hover {
    color: #006633;
}
.phone-icon {
    font-size: 1.25rem;
}
</style>
