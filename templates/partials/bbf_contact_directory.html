<section class="bbf-contact-directory">
    <div class="section-heading">
        <span class="section-heading__eyebrow">Get in Touch</span>
        <h2 class="section-heading__title">For BBF Enquiries Contact</h2>
    </div>

    <div class="contact-grid">
        {% for contact in contacts %}
        <div class="contact-card">
            <div class="contact-role">{{ contact.role }}</div>
            <p class="contact-title">{{ contact.title }}</p>
            {% if contact.holder_name %}
                <p class="contact-holder">{{ contact.holder_name }}</p>
            {% endif %}
            <a href="tel:+254{{ contact.tel_phone }}" class="contact-phone">
                <svg class="phone-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 4h4l2 5-2.5 1.5a14 14 0 006 6L17 14l5 2v4a2 2 0 01-2.2 2A18 18 0 012 6.2 2 2 0 014 4z"></path>
                </svg>
                {{ contact.phone_display }}
            </a>
        </div>
        {% endfor %}
    </div>
</section>
